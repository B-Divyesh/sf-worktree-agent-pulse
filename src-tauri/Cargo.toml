[package]
name = "worktree-agent-pulse"
version = "0.1.5"
description = "A local pulse board for Git worktrees and coding agents"
authors = ["Param Factory"]
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-worktree-agent-pulse"
edition = "2021"

[lib]
name = "worktree_agent_pulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
