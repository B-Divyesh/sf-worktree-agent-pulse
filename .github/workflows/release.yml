name: Release desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: "--bundles appimage,deb"
            rust_target: ""
          - platform: windows-latest
            args: "--bundles nsis"
            rust_target: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles dmg"
            rust_target: "aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin --bundles dmg"
            rust_target: "x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Install Linux system packages
        if: matrix.platform == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: "Worktree Agent Pulse ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          releaseBody: "Unsigned desktop builds for macOS, Windows, and Linux. See the README for install notes."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  checksums:
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$RELEASE_TAG" --dir release-assets
      - name: Write checksums and manifest
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS' ! -name 'latest.json' -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
          node ../scripts/release-manifest.mjs "$RELEASE_TAG" "${{ github.repository }}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            release-assets/SHA256SUMS
            release-assets/latest.json
